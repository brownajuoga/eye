mode: balanced
controls:
  detection_enabled: true
  auto_mode: true
  confidence_threshold: 0.35
  iou_threshold: 0.5
model:
  default: yolov8n.pt
  lightweight: yolov8n.pt
  balanced: yolov8n.pt
  performance: yolov8n.pt
  custom: /home/aabrown/me/eye/eye/ai_server/yolo11n.pt
  confidence_threshold: 0.35
expert:
  backend: mock
  ollama_model: llava:7b
  transformers_model: vikhyatk/moondream2
  max_retries: 2
  timeout_seconds: 20
  task_profile: general
memory:
  max_events: 500
  recent_limit: 10
  pattern_window: 25
watch_for:
- bottle
- backpack
- cell phone
- hand
- handbag
- laptop
- person
ignore:
- chair
- couch
- bed
video_analysis:
  sample_interval_seconds: 1.0
  max_frames: 8
automation_rules:
- name: Person Alert
  condition: IF person detected with confidence > 0.60
  action: Create alert and keep balanced mode active
  enabled: true
- name: Idle Optimization
  condition: IF no objects for 120 seconds
  action: Reduce analysis frequency and mark system idle
  enabled: true
rules:
  require_person: false
  min_confidence: 0.29
  min_watch_matches: 1
  always_analyze: false
  alert_on_repeated_labels: 3
  repeated_label_window: 10
