mode: balanced
controls:
  detection_enabled: true
  auto_mode: true
  confidence_threshold: 0.35
  iou_threshold: 0.5
model:
  default: yolov8n.pt
  lightweight: yolov8n.pt
  balanced: yolov8n.pt
  performance: yolov8n.pt
  custom: null
  confidence_threshold: 0.35
expert:
  backend: mock
  realtime_enabled: false
  realtime_only_important: true
  ollama_model: llava:7b-v1.6
  transformers_model: vikhyatk/moondream2
  max_retries: 2
  timeout_seconds: 20
  task_profile: general
  mission: Monitor the scene, reason about meaningful activity, and adapt system behavior
    when patterns emerge.
  operator_instructions: ''
  active_task: Autonomously monitor the environment while staying controllable by
    the user.
memory:
  max_events: 500
  recent_limit: 10
  pattern_window: 25
watch_for:
- bottle
- backpack
- cell phone
- hand
- handbag
- laptop
- person
ignore:
- chair
- couch
- bed
video_analysis:
  sample_interval_seconds: 1.0
  max_frames: 8
automation_rules:
- name: Person Alert
  condition: IF person detected with confidence > 0.60
  action: Create alert and keep balanced mode active
  enabled: true
- name: Retail Concealment Watch
  condition: IF person and handbag detected with confidence > 0.45
  action: Create alert for possible concealment and keep performance mode active
  enabled: true
- name: Suspicious Object Handling
  condition: IF person and bottle detected with confidence > 0.45
  action: Create alert for item handling review
  enabled: true
- name: Idle Optimization
  condition: IF no objects for 120 seconds
  action: Reduce analysis frequency and mark system idle
  enabled: true
rules:
  require_person: false
  min_confidence: 0.35
  min_watch_matches: 1
  always_analyze: false
  alert_on_repeated_labels: 3
  repeated_label_window: 10
